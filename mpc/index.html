<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>modpackgen // PackForager</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <!-- Libraries for exporting .mrpack -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
  <div id="workspace">
    <!-- Activity Bar -->
    <nav id="activity-bar">
      <button class="activity-tab active" data-target="panel-info" title="Information & Filters">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      </button>
      <button class="activity-tab" data-target="panel-addons" title="Addons">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
      </button>
      <button class="activity-tab" data-target="panel-ai" title="AI Tools">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
      </button>
    </nav>

    <!-- Left Panel -->
    <aside id="left-sidebar">
      <!-- TAB 1: Search Filters & Pack Info -->
      <div id="panel-info" class="sidebar-panel active split-panel">
        <div class="panel-half">
          <div class="panel-header">SEARCH FILTERS</div>
          <div class="input-group">
            <label>Source</label>
            <select id="search-source">
              <option value="modrinth">Modrinth</option>
              <option value="curseforge">CurseForge</option>
            </select>
          </div>
          <div class="input-group">
            <label>Category</label>
            <select id="search-category">
              <option value="">Any</option>
              <option value="adventure">Adventure</option>
              <option value="equipment">Equipment</option>
              <option value="magic">Magic</option>
              <option value="optimization">Optimization</option>
              <option value="technology">Technology</option>
              <option value="utility">Utility</option>
            </select>
          </div>
        </div>

        <div class="panel-half border-top">
          <div class="panel-header">PACK INFO</div>
          <div class="input-group"><label>Modpack Name</label><input type="text" id="pack-name" placeholder="My Modpack"></div>
          <div class="input-group"><label>Minecraft Version</label><select id="mc-version"><option>Loading...</option></select></div>
          <div class="input-group">
            <label>Mod Loader</label>
            <select id="pack-loader">
              <option value="fabric">Fabric</option><option value="forge">Forge</option>
              <option value="quilt">Quilt</option><option value="neoforge">NeoForge</option>
            </select>
          </div>
          <div class="input-group">
            <label>Shader Loader</label>
            <select id="shader-loader">
              <option value="none">None</option><option value="iris">Iris</option>
              <option value="oculus">Oculus</option><option value="optifine">OptiFine</option>
            </select>
          </div>
        </div>
      </div>

      <!-- TAB 2: Addons -->
      <div id="panel-addons" class="sidebar-panel hidden">
        <div class="panel-header">ADDONS</div>
        <div id="addons-list" class="flex-col"></div>
      </div>

      <!-- TAB 3: AI Tools -->
      <div id="panel-ai" class="sidebar-panel hidden">
        <div class="panel-header">QUEST AI (WIP)</div>
        <div class="p-2 text-center">
          <button class="btn-primary w-full" id="btn-dl-ai" disabled>Requires 1.20.1 (Fabric/Forge)</button>
          <p class="text-xs text-muted mt-2">Custom WebLLM model for auto-generating .snbt quests locally.</p>
        </div>
      </div>
    </aside>

    <!-- Center Panel -->
    <main id="center-panel">
      <header id="center-tabs">
        <button class="center-tab active" data-target="tab-search">Search</button>
        <button class="center-tab" data-target="tab-quests">Quests (.snbt)</button>
      </header>
      
      <div id="center-content">
        <!-- Search Workspace -->
        <div id="tab-search" class="tab-pane active">
          <div class="search-bar">
            <input type="text" id="mod-search" placeholder="Search mods... (Leave empty for popular)">
            <button id="btn-search" class="btn-primary">Search</button>
          </div>
          <div id="search-results"></div>
        </div>
        
        <!-- Quests Workspace -->
        <div id="tab-quests" class="tab-pane hidden" style="padding:0; overflow:hidden;">
          
          <!-- View 1: Questlines List -->
          <div id="questlines-view" class="quest-workspace-view active">
            <div class="quest-header flex-between p-2" style="border-bottom: 1px solid var(--border-light)">
              <span style="font-weight:bold; color:var(--green)">Questlines</span>
              <div style="display:flex; gap:8px;">
                <button class="btn-primary" id="btn-import-snbt">Import .snbt</button>
                <input type="file" id="import-snbt-input" accept=".snbt" class="hidden">
                <button class="btn-primary" id="btn-create-questline">Create New</button>
              </div>
            </div>
            <div id="questlines-list" class="p-2" style="display:flex; flex-direction:column; gap:8px; overflow-y:auto;">
              <!-- Questline cards injected here -->
            </div>
          </div>

          <!-- View 2: Canvas Visualizer -->
          <div id="quest-canvas-view" class="quest-workspace-view hidden">
            <div class="quest-header flex-between p-2" style="border-bottom: 1px solid var(--border-light); background:var(--panel-bg); z-index:10;">
              <div>
                <button class="icon-btn" id="btn-back-questlines" style="margin-right:10px;">←</button>
                <span id="current-questline-title" style="font-weight:bold; color:var(--text)">Chapter Name</span>
              </div>
              <div style="display:flex; gap:8px; align-items:center;">
                <label style="color:var(--muted); font-size:10px; display:flex; align-items:center; gap:4px; cursor:pointer;">
                  <input type="checkbox" id="toggle-link-mode"> Link Mode
                </label>
                <button class="btn-primary" id="btn-create-quest">Create Quest</button>
              </div>
            </div>
            <div id="quest-canvas">
              <svg id="quest-lines" xmlns="http://www.w3.org/2000/svg"></svg>
              <div id="quest-nodes-container"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Right Panel -->
    <aside id="right-sidebar">
      <header class="panel-header flex-between">
        <span>MOD LIST</span>
        <button id="btn-add-custom" title="Add Custom Mod" class="icon-btn">+</button>
        <input type="file" id="custom-mod-input" multiple class="hidden">
      </header>
      <div id="mod-list-container"></div>
      <div class="export-box"><button id="btn-export" class="btn-export">Export as .mrpack</button></div>
    </aside>
  </div>

  <!-- Questline Creation Modal -->
  <div id="modal-questline" class="modal-overlay hidden">
    <div class="modal-content">
      <h3 style="margin-bottom: 10px; color:var(--green)">New Questline</h3>
      <div class="input-group"><label>Title</label><input type="text" id="ql-title"></div>
      <div class="input-group"><label>Description</label><input type="text" id="ql-desc"></div>
      <div class="input-group">
        <label>Quest Shape</label>
        <select id="ql-shape">
          <option value="circle">Circle</option><option value="square">Square</option><option value="hexagon">Hexagon</option>
        </select>
      </div>
      <div class="flex-between mt-2" style="padding: 12px;">
        <button class="btn-primary" onclick="document.getElementById('modal-questline').classList.add('hidden')">Cancel</button>
        <button class="btn-primary" id="btn-save-questline" style="border-color:var(--green)">Save</button>
      </div>
    </div>
  </div>

  <!-- Quest Editor Modal -->
  <div id="modal-quest" class="modal-overlay hidden">
    <div class="modal-content modal-wide">
      <h3 id="modal-quest-title-label" style="margin-bottom: 10px; color:var(--green)">Edit Quest</h3>
      <div class="input-group"><label>Title</label><input type="text" id="q-title"></div>
      <div class="input-group"><label>Lore / Description</label><input type="text" id="q-desc"></div>
      
      <div class="tasks-section mt-2">
        <div class="flex-between" style="padding: 0 12px; margin-bottom: 6px;">
          <label style="font-size:10px; color:var(--muted); text-transform:uppercase;">Item Tasks</label>
          <button class="btn-primary" id="btn-add-task" style="padding: 2px 6px; font-size:10px;">+ Add Task</button>
        </div>
        <div id="quest-tasks-container" style="padding: 0 12px; display:flex; flex-direction:column; gap:8px;">
          <!-- Dynamically populated tasks -->
        </div>
      </div>

      <div class="flex-between mt-2" style="padding: 12px; margin-top:16px;">
        <div>
          <button class="btn-danger hidden" id="btn-delete-quest">Delete Quest</button>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn-primary" onclick="document.getElementById('modal-quest').classList.add('hidden')">Cancel</button>
          <button class="btn-primary" id="btn-save-quest" style="border-color:var(--green)">Save Node</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
