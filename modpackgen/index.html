<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModpackGen // Terminal</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="grid-bg"></div>
    <div class="glow-overlay"></div>

    <div class="container">
        <header>
            <div class="logo">
                <span class="green">Modpack</span><span class="dim-green">Gen</span>
                <span class="blink">_</span>
            </div>
            <nav class="controls">
                <button id="export-btn" class="nav-btn">Export Config</button>
                
                <!-- Make Import button act as the primary, larger action -->
                <label for="import-input" class="nav-btn primary-btn">Import Config</label>
                <input type="file" id="import-input" hidden accept=".json">
            </nav>
        </header>

        <main class="dashboard">
            <!-- TOP SECTION: 2 COLUMNS -->
            <section class="top-dashboard">
                <!-- Left: Version & Loader -->
                <div class="panel config-box">
                    <h2 class="section-title">Environment Setup</h2>
                    <div class="input-group">
                        <label>Target Version</label>
                        <select id="version-picker"></select>
                    </div>
                    <div class="input-group">
                        <label>Mod Loader</label>
                        <div class="loader-btns" id="loader-picker">
                            <button class="loader-btn active" data-loader="fabric">Fabric</button>
                            <button class="loader-btn" data-loader="forge">Forge</button>
                            <button class="loader-btn" data-loader="neoforge">NeoForge</button>
                            <button class="loader-btn" data-loader="quilt">Quilt</button>
                        </div>
                    </div>
                </div>

                <!-- Right: Base & Addons -->
                <div class="panel config-box">
                    <h2 class="section-title">Foundation & Addons</h2>
                    <div class="input-group">
                        <label>Base Foundation (Select One)</label>
                        <!-- Replaced Custom Dropdown with Native Select -->
                        <select id="base-picker">
                            <option value="">No Base Selected</option>
                            <!-- Injected by JS -->
                        </select>
                    </div>
                    <div class="input-group" style="margin-top: 0.5rem;">
                        <label>Pack Addons (Select Multiple)</label>
                        <div class="addon-grid" id="addon-container">
                            <!-- Injected by JS -->
                        </div>
                    </div>
                </div>
            </section>

            <!-- MOD SEARCH -->
            <section class="panel">
                <h2 class="section-title">Search Modrinth</h2>
                <div class="search-bar-wrap">
                    <input type="text" id="mod-search" placeholder="Search mods (e.g. Sodium, JEI)...">
                    <select id="search-category">
                        <option value="">All Categories</option>
                        <option value="optimization">Optimization</option>
                        <option value="technology">Technology</option>
                        <option value="magic">Magic</option>
                        <option value="adventure">Adventure</option>
                        <option value="utility">Utility</option>
                        <option value="worldgen">World Gen</option>
                    </select>
                </div>
                <div class="search-results" id="search-results">
                    <p class="placeholder-text">Enter keywords to find mods</p>
                </div>
            </section>

            <!-- SELECTED MODS -->
            <section class="panel">
                <h2 class="section-title">Selected Components</h2>
                <div id="category-tabs" class="tabs"></div>
                <div class="mod-list" id="selected-mods">
                    <p class="placeholder-text">No mods selected yet.</p>
                </div>
            </section>

            <!-- FUTURE PLACEHOLDER -->
            <section class="panel ai-placeholder">
                <div class="ai-content">
                    <h3>AI Quest Generator</h3>
                    <p class="dim-green">WebLLM Integration Coming Soon: Generate quest lines based on your selected mods.</p>
                    <div class="progress-bar-loading"></div>
                </div>
            </section>
        </main>

        <footer>
            <span>v1.1.0-terminal</span>
            <span>Connected to Modrinth API v2</span>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
