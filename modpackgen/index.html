<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modpack Creator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="app">
        <main class="editor-grid">
            <!-- COLUMN 1: CONFIG -->
            <aside class="panel config-panel">
                <section>
                    <h2 class="panel-title"><i data-lucide="settings"></i> Base Config</h2>
                    <div class="input-group">
                        <label>Pack Name</label>
                        <input type="text" id="pack-name" value="New Modpack">
                    </div>
                    <div class="input-group">
                        <label>Game Version</label>
                        <select id="game-version" onchange="validateAllMods()"></select>
                    </div>
                    <div class="input-group">
                        <label>Mod Loader</label>
                        <select id="mod-loader" onchange="validateAllMods()">
                            <option value="fabric">Fabric</option>
                            <option value="forge">Forge</option>
                            <option value="neoforge">NeoForge</option>
                            <option value="quilt">Quilt</option>
                        </select>
                    </div>
                </section>

                <section>
                    <h2 class="panel-title"><i data-lucide="package-plus"></i> Addons</h2>
                    <div id="addon-list" class="addon-stack">
                        <!-- Pulls from data.json -->
                    </div>
                </section>
            </aside>

            <!-- COLUMN 2: SEARCH -->
            <section class="panel search-panel">
                <div class="search-bar">
                    <i data-lucide="search"></i>
                    <input type="text" id="mod-search" placeholder="Search Modrinth...">
                </div>
                <div id="search-results" class="results-list"></div>
            </section>

            <!-- COLUMN 3: WORKSPACE -->
            <section class="panel workspace-panel">
                <div class="workspace-header">
                    <h2 class="panel-title"><i data-lucide="list-checks"></i> Selection</h2>
                    <span id="mod-count-tag" class="badge">0</span>
                </div>
                <div id="manifest-content" class="workspace-content">
                    <!-- Categorized mods go here -->
                </div>
            </section>
        </main>

        <!-- FLOATING ACTION BUTTON -->
        <button id="export-btn" class="export-fab" title="Export .mrpack">
            <i data-lucide="download"></i>
            <span>Export .mrpack</span>
        </button>
    </div>

    <script src="app.js"></script>
</body>
</html>
