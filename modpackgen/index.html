<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>modpackgen // PackForager</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <!-- Libraries for exporting .mrpack and .zip -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
  <div id="workspace">
    <!-- Activity Bar -->
    <nav id="activity-bar">
      <button class="activity-tab active" data-target="panel-info" title="Information & Filters">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      </button>
      <button class="activity-tab" data-target="panel-addons" title="Addons">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
      </button>
      <button class="activity-tab" data-target="panel-ai" title="Web LLM Quests">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
      </button>
    </nav>

    <!-- Left Panel -->
    <aside id="left-sidebar">
      
      <!-- TAB 1: Search Filters & Pack Info -->
      <div id="panel-info" class="sidebar-panel active split-panel">
        
        <!-- Top Half: Search Filters -->
        <div class="panel-half">
          <div class="panel-header">SEARCH FILTERS</div>
          <div class="input-group">
            <label>Source</label>
            <select id="search-source">
              <option value="modrinth">Modrinth</option>
              <option value="curseforge">CurseForge</option>
            </select>
          </div>
          <div class="input-group">
            <label>Category</label>
            <select id="search-category">
              <option value="">Any</option>
              <option value="adventure">Adventure</option>
              <option value="equipment">Equipment</option>
              <option value="magic">Magic</option>
              <option value="optimization">Optimization</option>
              <option value="technology">Technology</option>
              <option value="utility">Utility</option>
            </select>
          </div>
        </div>

        <!-- Bottom Half: Pack Info -->
        <div class="panel-half border-top">
          <div class="panel-header">PACK INFO</div>
          <div class="input-group">
            <label>Modpack Name</label>
            <input type="text" id="pack-name" placeholder="My Modpack">
          </div>
          <div class="input-group">
            <label>Minecraft Version</label>
            <select id="mc-version"><option>Loading...</option></select>
          </div>
          <div class="input-group">
            <label>Mod Loader</label>
            <select id="pack-loader">
              <option value="fabric">Fabric</option>
              <option value="forge">Forge</option>
              <option value="quilt">Quilt</option>
              <option value="neoforge">NeoForge</option>
            </select>
          </div>
          <div class="input-group">
            <label>Shader Loader</label>
            <select id="shader-loader">
              <option value="none">None</option>
              <option value="iris">Iris</option>
              <option value="oculus">Oculus</option>
              <option value="optifine">OptiFine</option>
            </select>
          </div>
        </div>
      </div>

      <!-- TAB 2: Addons -->
      <div id="panel-addons" class="sidebar-panel hidden">
        <div class="panel-header">ADDONS</div>
        <div id="addons-list" class="flex-col gap-2"></div>
      </div>

      <!-- TAB 3: Web LLM Quests -->
      <div id="panel-ai" class="sidebar-panel hidden">
        <div class="panel-header">WEB LLM QUESTS</div>
        <div class="p-2 text-center">
          <button class="btn-primary w-full" id="btn-dl-ai" disabled>
            Requires 1.20.1 (Fabric/Forge)
          </button>
          <p class="text-xs text-muted mt-2">Custom AI model for generating .snbt quests locally.</p>
        </div>
      </div>
    </aside>

    <!-- Center Panel -->
    <main id="center-panel">
      <header id="center-tabs">
        <button class="center-tab active" data-target="tab-search">Search Mods</button>
        <button class="center-tab" data-target="tab-quests">Quest Editor</button>
      </header>
      
      <div id="center-content">
        <div id="tab-search" class="tab-pane active">
          <div class="search-bar">
            <input type="text" id="mod-search" placeholder="Search mods... (Leave empty for popular)">
            <button id="btn-search" class="btn-primary">Search</button>
          </div>
          <div id="search-results"></div>
        </div>
        
        <div id="tab-quests" class="tab-pane hidden">
           <div id="quest-editor-workspace">
              <!-- Quest Editor Left Panel: Chapters -->
              <aside id="quest-chapters-panel">
                  <header class="panel-header flex-between">
                      <span>CHAPTERS</span>
                      <button id="btn-add-chapter" title="Add Chapter" class="icon-btn">+</button>
                  </header>
                  <div id="chapter-list-container"></div>
                  <div class="export-box">
                      <button id="btn-export-quests" class="btn-export">Export Quests</button>
                  </div>
              </aside>

              <!-- Quest Editor Center Panel: Quest Map/Grid -->
              <main id="quest-grid-panel">
                  <div id="quest-grid-header">
                      <span id="quest-grid-title">Select a Chapter</span>
                      <button id="btn-add-quest" class="btn-primary hidden" title="Add Quest to Chapter">+</button>
                  </div>
                  <div id="quest-grid-content">
                    <div class="placeholder-text">
                        <h3>No Chapter Selected</h3>
                        <p>Select a chapter from the left panel or create a new one to begin.</p>
                    </div>
                  </div>
              </main>

              <!-- Quest Editor Right Panel: Inspector -->
              <aside id="quest-inspector-panel">
                  <header class="panel-header">INSPECTOR</header>
                  <div id="inspector-content">
                      <div class="placeholder-text">
                          <p>Select a chapter or quest to edit its properties.</p>
                      </div>
                  </div>
              </aside>
           </div>
        </div>
      </div>
    </main>

    <!-- Right Panel -->
    <aside id="right-sidebar">
      <header class="panel-header flex-between">
        <span>MOD LIST</span>
        <div>
          <button id="btn-generate-all-quests" title="Auto-Generate All Quests" class="icon-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px; height:16px;"><path d="m12 3-1.41 1.41L16.17 10H4v2h12.17l-5.58 5.59L12 19l8-8-8-8z"></path></svg>
          </button>
          <button id="btn-add-custom" title="Add Custom Mod" class="icon-btn">+</button>
        </div>
        <input type="file" id="custom-mod-input" multiple class="hidden">
      </header>
      
      <div id="mod-list-container">
        <!-- Categories injected here -->
      </div>

      <!-- Export Box -->
      <div class="export-box">
        <button id="btn-export" class="btn-export">Export as .mrpack</button>
      </div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
