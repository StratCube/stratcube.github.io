<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modpack Architect</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div id="app">
        <main class="editor-grid">
            <!-- COLUMN 1: CONFIG & ADDONS -->
            <aside class="panel">
                <div class="panel-header">
                    <i data-lucide="settings"></i> BASE CONFIG
                </div>
                <div class="panel-content scrollable">
                    <div class="input-group">
                        <label>Pack Name</label>
                        <input type="text" id="pack-name" value="New Modpack">
                    </div>
                    <div class="input-group">
                        <label>Game Version</label>
                        <select id="game-version" onchange="validateAllMods()"></select>
                    </div>
                    <div class="input-group">
                        <label>Mod Loader</label>
                        <select id="mod-loader" onchange="validateAllMods()">
                            <option value="fabric">Fabric</option>
                            <option value="forge">Forge</option>
                            <option value="neoforge">NeoForge</option>
                            <option value="quilt">Quilt</option>
                        </select>
                    </div>

                    <div class="panel-header" style="margin-top:20px; padding-left:0; border-bottom: none;">
                        <i data-lucide="package-plus"></i> ADDONS
                    </div>
                    <div id="addon-list" class="addon-stack"></div>
                </div>
            </aside>

            <!-- COLUMN 2: MOD SEARCH -->
            <section class="panel search-panel">
                <div class="search-bar">
                    <i data-lucide="search"></i>
                    <input type="text" id="mod-search" placeholder="Search Modrinth mods...">
                </div>
                <div id="search-results" class="panel-content scrollable results-list"></div>
            </section>

            <!-- COLUMN 3: SELECTED MODS -->
            <section class="panel workspace-panel">
                <div class="panel-header workspace-header">
                    <span><i data-lucide="list-checks"></i> SELECTION</span>
                    <span id="mod-count-tag" class="badge">0</span>
                </div>
                <div id="manifest-content" class="panel-content scrollable"></div>
            </section>
        </main>

        <!-- FLOATING EXPORT -->
        <button id="export-btn" class="export-fab">
            <i data-lucide="download"></i>
            <span>Export .mrpack</span>
        </button>
    </div>

    <script src="app.js"></script>
</body>
</html>
