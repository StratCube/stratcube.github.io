<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stratified</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <!-- Libraries for exporting .mrpack and .zip -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
  <div id="workspace">
    <!-- Activity Bar -->
    <nav id="activity-bar">
      <button class="activity-tab active" data-target="panel-info" title="Information & Filters">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      </button>
      <button class="activity-tab" data-target="panel-addons" title="Addons">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
      </button>
      <button class="activity-tab" data-target="panel-blueprints" title="Progression Blueprints">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
      </button>
    </nav>

    <!-- Left Panel -->
    <aside id="left-sidebar">
      
      <!-- TAB 1: Search Filters & Pack Info -->
      <div id="panel-info" class="sidebar-panel active split-panel">
        <div class="panel-half">
          <div class="panel-header">SEARCH FILTERS</div>
          <div class="input-group">
            <label>Source</label>
            <select id="search-source">
              <option value="modrinth">Modrinth</option>
              <option value="curseforge">CurseForge</option>
            </select>
          </div>
          <div class="input-group">
            <label>Category</label>
            <select id="search-category">
              <option value="">Any</option>
              <option value="adventure">Adventure</option>
              <option value="equipment">Equipment</option>
              <option value="magic">Magic</option>
              <option value="optimization">Optimization</option>
              <option value="technology">Technology</option>
              <option value="utility">Utility</option>
            </select>
          </div>
        </div>

        <div class="panel-half border-top">
          <div class="panel-header">PACK INFO</div>
          <div class="input-group">
            <label>Modpack Name</label>
            <input type="text" id="pack-name" placeholder="My Modpack">
          </div>
          <div class="input-group">
            <label>Minecraft Version</label>
            <select id="mc-version"><option>1.20.1</option></select>
          </div>
          <div class="input-group">
            <label>Mod Loader</label>
            <select id="pack-loader">
              <option value="fabric">Fabric</option>
              <option value="forge">Forge</option>
              <option value="neoforge">NeoForge</option>
            </select>
          </div>
        </div>
      </div>

      <!-- TAB 2: Addons -->
      <div id="panel-addons" class="sidebar-panel hidden">
        <div class="panel-header">ADDONS</div>
        <div id="addons-list" class="flex-col gap-2 p-2"></div>
      </div>

      <!-- TAB 3: Progression Blueprints -->
      <div id="panel-blueprints" class="sidebar-panel hidden">
        <div class="panel-header">PROGRESSION BLUEPRINTS</div>
        <div class="p-2 text-center flex-col gap-2">
          <p class="text-xs text-muted mt-2 text-left">
            Core Logic Engine: Generate FTB Quests chapter trees automatically based on mods in your modpack.
          </p>
          <button class="btn-primary w-full" id="btn-generate-blueprints">
            Auto-Generate from Mod List
          </button>
          <button class="btn-primary w-full" id="btn-clear-canvas" style="background: rgba(255, 68, 102, 0.1); color: #ff4466; border-color: rgba(255, 68, 102, 0.3);">
            Clear Canvas
          </button>
        </div>
      </div>
    </aside>

    <!-- Center Panel -->
    <main id="center-panel">
      <header id="center-tabs">
        <button class="center-tab active" data-target="tab-search">Search</button>
        <button class="center-tab" data-target="tab-quests">Quests Canvas</button>
      </header>
      
      <div id="center-content">
        <!-- Search Tab -->
        <div id="tab-search" class="tab-pane active">
          <div class="search-bar">
            <input type="text" id="mod-search" placeholder="Search mods... (Leave empty for popular)">
            <button id="btn-search" class="btn-primary">Search</button>
          </div>
          <div id="search-results"></div>
        </div>
        
        <!-- Quests Tab -->
        <div id="tab-quests" class="tab-pane hidden" style="padding: 0;">
          <div id="quest-toolbar" class="flex-between p-2">
            <span class="text-muted" style="font-size: 11px;">FTB Quests Blueprint Visualizer</span>
            <div class="search-bar">
              <button id="btn-add-node" class="btn-primary">+ Add Node</button>
            </div>
          </div>
          <!-- Grid Canvas -->
          <div id="quest-canvas-container">
            <div id="quest-canvas">
              <!-- JS will inject nodes (.quest-node) and SVG lines here -->
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Right Panel -->
    <aside id="right-sidebar">
      <header class="panel-header flex-between">
        <span>MOD LIST</span>
        <button id="btn-add-custom" title="Add Custom Mod" class="icon-btn">+</button>
      </header>
      
      <div id="mod-list-container">
        <!-- Categories injected here -->
      </div>

      <!-- Export Box -->
      <div class="export-box flex-col gap-2">
        <button id="btn-export-quests" class="btn-export" style="background: rgba(255, 170, 0, 0.1); color: #ffaa00; border-color: #ffaa00;">Export .snbt Quests</button>
        <button id="btn-export" class="btn-export">Export as .mrpack</button>
      </div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
