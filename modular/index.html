<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PackForager</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
  <div id="workspace">
    <!-- Activity Bar -->
    <nav id="activity-bar">
      <button class="activity-tab active" data-target="panel-info" title="Information & Filters">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      </button>
      <button class="activity-tab" data-target="panel-addons" title="Addons">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
      </button>
      <!-- REPLACED DOLLAR SIGN WITH BOOK ICON -->
      <button class="activity-tab" data-target="panel-quests" title="Quest Mods">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
      </button>
    </nav>

    <!-- Left Panel -->
    <aside id="left-sidebar">
      <!-- TAB 1: Search Filters & Pack Info -->
      <div id="panel-info" class="sidebar-panel active split-panel">
        <div class="panel-half">
          <div class="panel-header">SEARCH FILTERS</div>
          <div class="input-group">
            <label>Source</label>
            <select id="search-source">
              <option value="modrinth">Modrinth</option>
              <option value="curseforge">CurseForge</option>
            </select>
          </div>
          <div class="input-group">
            <label>Category</label>
            <select id="search-category">
              <option value="">Any</option>
              <option value="adventure">Adventure</option>
              <option value="equipment">Equipment</option>
              <option value="magic">Magic</option>
              <option value="optimization">Optimization</option>
              <option value="technology">Technology</option>
              <option value="utility">Utility</option>
            </select>
          </div>
        </div>

        <div class="panel-half border-top">
          <div style="padding: 12px; border-bottom: 1px solid var(--border-light); background: var(--bg);">
            <button id="btn-export-left" class="btn-export">Export as .mrpack</button>
          </div>

          <div class="panel-header">PACK INFO</div>
          <div class="input-group">
            <label>Modpack Name</label>
            <input type="text" id="pack-name" placeholder="My Modpack">
          </div>
          <div class="input-group">
            <label>Minecraft Version</label>
            <select id="mc-version"><option>Loading...</option></select>
          </div>
          <div class="input-group">
            <label>Mod Loader</label>
            <select id="pack-loader">
              <option value="fabric">Fabric</option>
              <option value="forge">Forge</option>
              <option value="quilt">Quilt</option>
              <option value="neoforge">NeoForge</option>
            </select>
          </div>
          <div class="input-group">
            <label>Loader Version (Optional)</label>
            <input type="text" id="loader-version" placeholder="Auto-detect (e.g. 0.15.7)">
          </div>
          <div class="input-group">
            <label>Auto Dependency</label>
            <button id="btn-auto-dep" class="btn-primary w-full" style="margin-top: 4px;">Resolve Dependencies</button>
          </div>
        </div>
      </div>

      <!-- TAB 2: Addons -->
      <div id="panel-addons" class="sidebar-panel hidden">
        <div class="panel-header">ADDONS</div>
        <div id="addons-list" class="flex-col gap-2"></div>
      </div>

      <!-- TAB 3: Quest Mods -->
      <div id="panel-quests" class="sidebar-panel hidden">
        <div class="panel-header">QUEST MODS</div>
        <div class="input-group">
          <input type="text" id="quest-mod-search" placeholder="Search stages...">
        </div>
        <div id="quest-mods-list" class="flex-col gap-2 p-2" style="flex:1; overflow-y:auto;"></div>
      </div>
    </aside>

    <!-- Center Panel -->
    <main id="center-panel">
      <header id="center-tabs">
        <button class="center-tab active" data-target="tab-search">Search</button>
        <button class="center-tab" data-target="tab-quests">Quests (.snbt)</button>
      </header>
      
      <div id="center-content">
        <!-- Search Pane -->
        <div id="tab-search" class="tab-pane active">
          <div class="search-bar">
            <input type="text" id="mod-search" placeholder="Search mods... (Leave empty for popular)">
            <button id="btn-search" class="btn-primary">Search</button>
          </div>
          <div id="search-results"></div>
        </div>
        
        <!-- Quest Editor Pane -->
        <div id="tab-quests" class="tab-pane hidden" style="padding:0; overflow:hidden; display:flex; flex-direction:column;">
          <div id="quest-topbar" style="display:flex; align-items:center; gap:8px; padding:8px; background:var(--panel-bg); border-bottom:1px solid var(--border); flex-shrink:0; overflow-x:auto;">
            <div id="quest-chapters-list" style="display:flex; gap:4px; flex:1;"></div>
            <button id="btn-add-chapter" class="btn-primary" style="padding:4px 8px;">+ Chapter</button>
            <button id="btn-layout-quests" class="btn-primary" style="padding:4px 8px;">⊞ Layout</button>
            <button id="btn-add-quest" class="btn-primary" style="padding:4px 8px;">+ Quest</button>
            <button id="btn-export-quests" class="btn-export" style="padding:4px 8px; width:auto; border-radius:4px;">⬇ Export Quests</button>
          </div>
          
          <div id="quest-canvas-container" style="flex:1; position:relative; overflow:hidden; background:#0a0a0a; user-select:none; cursor:default;">
            <div style="position:absolute; top:8px; right:8px; z-index:10; display:flex; gap:6px;" id="quest-status-bar"></div>
            <div style="position:absolute; top:8px; left:8px; z-index:10; display:flex; gap:4px;">
              <button class="btn-primary" id="btn-zoom-in" style="padding:2px 8px;">+</button>
              <button class="btn-primary" id="btn-zoom-out" style="padding:2px 8px;">-</button>
              <button class="btn-primary" id="btn-zoom-reset" style="padding:2px 8px;">⟳</button>
            </div>
            
            <div id="quest-canvas-inner" style="transform-origin: 0 0; position:relative; width:4000px; height:4000px;">
              <!-- Embedded Defs for Arrows -->
              <svg id="quest-edges" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1; overflow:visible;">
                <defs>
                  <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b" />
                  </marker>
                  <marker id="arr-sel" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L8,3 z" fill="#fbbf24" />
                  </marker>
                </defs>
                <g id="quest-edges-paths"></g>
              </svg>
              <div id="quest-nodes" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:2;"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Right Panel -->
    <aside id="right-sidebar">
      <!-- Standard Mods View -->
      <div id="right-mods-view" class="split-panel">
        <header class="panel-header flex-between">
          <span>MOD LIST</span>
          <button id="btn-add-custom" title="Add Custom Mod" class="icon-btn">+</button>
          <input type="file" id="custom-mod-input" multiple class="hidden">
        </header>
        
        <div id="mod-list-container"></div>

        <div class="export-box">
          <button id="btn-export-right" class="btn-export">Export as .mrpack</button>
        </div>
      </div>
      
      <!-- Quest Editor Property View -->
      <div id="right-quest-view" class="split-panel hidden">
        <header class="panel-header flex-between">
          <span>QUEST EDITOR</span>
          <div style="display:flex; gap:8px;">
            <button id="btn-link-dep" title="Link Dependency" class="icon-btn" style="font-size:14px;">🔗</button>
            <button id="btn-del-quest" title="Delete Quest" class="icon-btn" style="color:#ff4466; font-size:14px;">🗑</button>
          </div>
        </header>
        <div id="quest-editor-container" style="flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column;">
           <!-- Fields injected here -->
        </div>
      </div>
    </aside>
  </div>

  <script src="main.js"></script>
</body>
</html>
